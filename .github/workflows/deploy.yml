name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            # ========================================
            # Load NVM / Node.js
            # ========================================

            export NVM_DIR="/home/deploy/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use 22

            echo "================================"
            echo "🚀 Starting deployment"
            echo "================================"

            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"

            # ========================================
            # Update repository
            # ========================================

            cd /var/www/checkActivity

            echo "📥 Fetching latest master..."

            git fetch origin master
            git reset --hard origin/master

            echo "📌 Deployed commit:"
            git --no-pager log -1 --oneline

            # ========================================
            # Backend
            # ========================================

            echo "================================"
            echo "📦 Installing backend dependencies"
            echo "================================"

            cd /var/www/checkActivity/backend

            npm ci

            # ========================================
            # Frontend
            # ========================================

            echo "================================"
            echo "🎨 Building frontend"
            echo "================================"

            cd /var/www/checkActivity/frontend

            npm ci
            npm run build

            # ========================================
            # Restart application
            # ========================================

            echo "================================"
            echo "🔄 Restarting checkActivity"
            echo "================================"

            sudo -n systemctl restart checkactivity

            # ========================================
            # Verify service
            # ========================================

            echo "⏳ Waiting for application..."
            sleep 3

            echo "📊 Service status:"
            sudo systemctl is-active checkactivity

            echo "🕐 Service start time:"
            sudo systemctl show checkactivity \
              -p ExecMainStartTimestamp

            # ========================================
            # Health check
            # ========================================

            echo "================================"
            echo "❤️ Health check"
            echo "================================"

            curl -f http://127.0.0.1:5000/health

            echo ""
            echo "================================"
            echo "✅ DEPLOYMENT SUCCESSFUL"
            echo "================================"
